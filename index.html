<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Kagaz PDF Tools</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left-aligned masthead over drifting print-colour light (cyan / magenta / yellow);
   every panel is liquid glass with a pointer-following sheen and a jelly wobble on hover and press.
   Calm mode, reduced motion, reduced transparency and high contrast all fall back to solid, still panels. */
:root{
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#EDF1F8; --ink:#0B1424; --muted:#43516A; --solid:#FFFFFF; --tint:rgba(11,20,36,.07);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.86);
  --edge:rgba(255,255,255,.85); --line:rgba(11,20,36,.2); --hi:rgba(255,255,255,.95); --lo:rgba(255,255,255,.25);
  --shadow:rgba(30,50,110,.2); --sheen:rgba(255,255,255,.75);
  --cyan:#0097BA; --magenta:#D4136F; --yellow:#E5A800;
  --blob-c:rgba(0,151,186,.5); --blob-m:rgba(212,19,111,.38); --blob-y:rgba(229,168,0,.5);
  --bad:#B3261E; --focus:#0A4FD0;
  --blur:blur(20px) saturate(1.7);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070C18; --ink:#EEF3FB; --muted:#AAB7CC; --solid:#141D30; --tint:rgba(255,255,255,.09);
    --glass:rgba(26,38,66,.52); --glass-strong:rgba(20,30,54,.86);
    --edge:rgba(255,255,255,.2); --line:rgba(255,255,255,.28); --hi:rgba(255,255,255,.3); --lo:rgba(255,255,255,.05);
    --shadow:rgba(0,0,0,.55); --sheen:rgba(255,255,255,.2);
    --cyan:#35C7E8; --magenta:#F55CA3; --yellow:#FFCB3D;
    --blob-c:rgba(53,199,232,.32); --blob-m:rgba(245,92,163,.28); --blob-y:rgba(255,203,61,.2);
    --bad:#FF9A90; --focus:#8DB8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070C18; --ink:#EEF3FB; --muted:#AAB7CC; --solid:#141D30; --tint:rgba(255,255,255,.09);
  --glass:rgba(26,38,66,.52); --glass-strong:rgba(20,30,54,.86);
  --edge:rgba(255,255,255,.2); --line:rgba(255,255,255,.28); --hi:rgba(255,255,255,.3); --lo:rgba(255,255,255,.05);
  --shadow:rgba(0,0,0,.55); --sheen:rgba(255,255,255,.2);
  --cyan:#35C7E8; --magenta:#F55CA3; --yellow:#FFCB3D;
  --blob-c:rgba(53,199,232,.32); --blob-m:rgba(245,92,163,.28); --blob-y:rgba(255,203,61,.2);
  --bad:#FF9A90; --focus:#8DB8FF; color-scheme:dark;
}
/* solid panels: calm mode, reduced transparency, high contrast, or no backdrop-filter support */
:root[data-calm="true"]{--glass:var(--solid);--glass-strong:var(--solid);--blur:none;--sheen:transparent}
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
  :root{--glass:var(--solid);--glass-strong:var(--solid);--blur:none;--sheen:transparent;--line:currentColor}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:var(--solid);--glass-strong:var(--solid);--blur:none}
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
main:focus,h1:focus,h2:focus{outline:none}
h1:focus-visible,h2:focus-visible{outline:3px solid var(--focus);outline-offset:6px}
.wrap{max-width:1040px;margin:0 auto;position:relative}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:0;top:-80px;z-index:30;padding:12px 16px;background:var(--ink);color:var(--bg);border:0;border-radius:4px;font:600 16px var(--font-body);cursor:pointer}
.skip:focus{top:0}

/* drifting light behind the glass */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;will-change:transform}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-24vmax;top:-30vmax;background:radial-gradient(closest-side,var(--blob-c),transparent);animation:drift1 28s ease-in-out infinite alternate}
.bg i:nth-child(2){width:62vmax;height:62vmax;right:-22vmax;top:8vmax;background:radial-gradient(closest-side,var(--blob-m),transparent);animation:drift2 34s ease-in-out infinite alternate}
.bg i:nth-child(3){width:66vmax;height:66vmax;left:12vmax;bottom:-34vmax;background:radial-gradient(closest-side,var(--blob-y),transparent);animation:drift3 31s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-12vmax,14vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.1)}}

/* liquid glass */
.tile,.drop,.files,.done,.chip,.calm,.field select,.field input[type=text],.field input[type=number],.ibtn,.btn.secondary{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)
}
.tile,.drop,.files,.done{
  background:var(--glass);border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),0 14px 34px -16px var(--shadow)
}
.chip,.calm,.btn.secondary,.ibtn{
  background:var(--glass-strong);border:1px solid var(--line);color:var(--ink);
  box-shadow:inset 0 1px 0 var(--hi),0 6px 16px -10px var(--shadow)
}
.field select,.field input[type=text],.field input[type=number]{
  background:var(--glass-strong);border:1px solid var(--line);color:var(--ink);
  box-shadow:inset 0 1px 2px var(--tint)
}
/* pointer-following sheen */
.tile::after,.drop::after,.done::after,.chip::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),var(--sheen),transparent 65%)
}
.tile:hover::after,.tile:focus-visible::after,.drop:hover::after,.drop.over::after,.done:hover::after,.chip:hover::after{opacity:1}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:30px}
.top-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:800 28px/1 var(--font-display);letter-spacing:-.02em;padding:6px 0;min-height:44px}
.dots{display:inline-flex;gap:3px}
.dots i{display:block;width:10px;height:20px;border-radius:5px;transform-origin:50% 100%}
.dots i:nth-child(1){background:var(--cyan)}.dots i:nth-child(2){background:var(--magenta)}.dots i:nth-child(3){background:var(--yellow)}
.brand:hover .dots i,.brand:focus-visible .dots i{animation:jelly .8s cubic-bezier(.3,1.6,.5,1)}
.brand:hover .dots i:nth-child(2){animation-delay:.07s}.brand:hover .dots i:nth-child(3){animation-delay:.14s}
.top .meta{font:400 13px var(--font-mono);color:var(--muted);letter-spacing:.02em}
.calm{font:600 14px/1 var(--font-body);padding:10px 16px;min-height:44px;border-radius:999px;cursor:pointer}
.calm[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.hero h1{margin:0 0 14px;font:800 clamp(36px,6.4vw,64px)/1.03 var(--font-display);letter-spacing:-.03em;max-width:18ch;text-wrap:balance}
.hero p{margin:0 0 24px;color:var(--muted);font-size:19px;max-width:52ch}
.jobs-label{font:500 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;overflow:hidden;font:500 14px/1 var(--font-mono);padding:13px 16px;min-height:46px;border-radius:999px;cursor:pointer;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{transform:scale(1.05,.97)}
.chip:active{transform:scale(.95,1.05)}

.group{margin-top:44px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ghead .sw{width:16px;height:16px;background:var(--g);flex:none;border-radius:50% 50% 50% 8px}
.ghead h2{margin:0;font:700 24px/1.2 var(--font-display);letter-spacing:-.01em}
.ghead .count{font:400 13px var(--font-mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,232px),1fr));gap:14px}
.g-organize{--g:var(--cyan)}.g-convert{--g:var(--magenta)}.g-optimize{--g:var(--yellow)}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-width:0;padding:22px 18px 18px;border-radius:20px;color:inherit;text-decoration:none;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.tile::before{content:"";position:absolute;left:0;top:0;width:18px;height:18px;border-top:3px solid var(--g);border-left:3px solid var(--g);border-top-left-radius:20px;pointer-events:none}
.tile:hover,.tile:focus-visible{animation:jelly .75s cubic-bezier(.3,1.6,.5,1)}
.tile:active{transform:scale(.97,1.03)}
.tile .tag{font:500 13px var(--font-mono);color:var(--muted);letter-spacing:.02em}
.tile h3{margin:0;font:700 19px/1.2 var(--font-display)}
.tile p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}

@keyframes jelly{
  0%{transform:scale(1,1)}
  22%{transform:scale(1.045,.95) rotate(-.4deg)}
  46%{transform:scale(.97,1.035) rotate(.3deg)}
  68%{transform:scale(1.015,.99)}
  100%{transform:scale(1,1)}
}
@keyframes pop{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.02);opacity:1}100%{transform:scale(1)}}

.tool{max-width:780px;margin:0 auto}
.back{display:inline-flex;align-items:center;margin-bottom:16px;font:500 14px var(--font-mono);color:var(--muted);text-decoration:underline;text-underline-offset:4px;min-height:44px}
.back:hover{color:var(--ink)}
.thead .tag{display:inline-block;font:500 13px var(--font-mono);color:var(--muted);margin-bottom:6px}
.thead h1{margin:0 0 8px;font:800 clamp(32px,5vw,46px)/1.08 var(--font-display);letter-spacing:-.025em;text-wrap:balance}
.thead p{margin:0 0 24px;color:var(--muted);max-width:56ch;font-size:18px}

.drop{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:34px 26px 28px;border-radius:24px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.drop.over{animation:jelly .7s cubic-bezier(.3,1.6,.5,1) infinite;border-color:var(--g)}
.cm{position:absolute;width:20px;height:20px;border:0 solid var(--g);pointer-events:none}
.cm.tl{left:6px;top:6px;border-top-width:3px;border-left-width:3px;border-top-left-radius:12px}
.cm.tr{right:6px;top:6px;border-top-width:3px;border-right-width:3px;border-top-right-radius:12px}
.cm.bl{left:6px;bottom:6px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:12px}
.cm.br{right:6px;bottom:6px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:12px}
.drop-title{margin:0;font:700 24px/1.2 var(--font-display)}
.drop-sub{margin:0 0 12px;color:var(--muted);font-size:16px;max-width:44ch}
.drop-actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.files{list-style:none;margin:16px 0 0;padding:0;border-radius:20px;overflow:hidden}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.thumb{flex:none;width:46px;height:58px;border:1px solid var(--line);background:var(--tint);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font:500 11px var(--font-mono);color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.finfo{flex:1;min-width:0}
.fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font:400 13px var(--font-mono);color:var(--muted)}
.fmeta.bad{color:var(--bad);font-weight:500}
.fact{display:flex;gap:6px;flex:none}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font:500 17px var(--font-body);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.ibtn:hover:not(:disabled){transform:scale(1.1)}
.ibtn:active:not(:disabled){transform:scale(.92)}
.ibtn:disabled{opacity:.4;cursor:default}

.opts{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.opts .hint-line{grid-column:1/-1;margin:0;color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{font-weight:600;font-size:15px}
.field select,.field input[type=text],.field input[type=number]{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;font:400 17px var(--font-body)}
.field input[type=range]{width:100%;accent-color:var(--focus);min-height:48px}
.rangerow{display:flex;align-items:center;gap:12px}
.rangerow output{font:500 15px var(--font-mono);min-width:4ch;text-align:right}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:500}
.check input{width:24px;height:24px;accent-color:var(--focus)}
.hint{color:var(--muted);font-size:14px;line-height:1.4}

.runbar{margin-top:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn{position:relative;font:600 16px/1 var(--font-body);padding:14px 24px;min-height:48px;border-radius:999px;border:1px solid var(--ink);cursor:pointer;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.btn:hover:not(:disabled){transform:scale(1.04,.97)}
.btn:active:not(:disabled){transform:scale(.95,1.06)}
.btn.primary{background:var(--ink);color:var(--bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 24px -12px var(--shadow)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:4px;font:500 16px var(--font-body);cursor:pointer;padding:12px 6px;min-height:48px}
.need{font:400 14px var(--font-mono);color:var(--muted)}
.prog{width:100%;max-width:440px}
.bar{height:8px;background:var(--tint);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:4px;transition:width .15s linear}
.prog .pmsg{margin-top:6px;font:400 13px var(--font-mono);color:var(--muted)}
.err{margin-top:18px;padding:14px 16px;background:var(--glass-strong);color:var(--bad);border:2px solid var(--bad);border-radius:16px;font-weight:600}

.done{position:relative;overflow:hidden;margin-top:28px;border-radius:24px;padding:24px 22px 16px;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.done h2{margin:0 0 2px;font:700 26px/1.2 var(--font-display)}
.done .sub{margin:0 0 12px;color:var(--muted);font:400 14px var(--font-mono)}
.outs{list-style:none;margin:0;padding:0}
.out{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.out .oinfo{flex:1;min-width:0}
.out .oname{font-weight:600;overflow-wrap:anywhere}
.out .ometa{font:400 13px var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.done-actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}

.foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);font:400 13px/1.7 var(--font-mono);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:min(92vw,440px);padding:14px 18px;background:var(--ink);color:var(--bg);border-radius:16px;font-weight:600;font-size:15px;z-index:40;text-align:center}


/* Kagaz Studio refresh */
:root{--bg:#f4f6fb;--ink:#111a2e;--muted:#59677e;--cyan:#4b8dff;--magenta:#8b5cf6;--yellow:#f4b740;--blur:blur(24px) saturate(1.65)}
body{font-size:16px;padding-top:26px;background-image:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%)}
.wrap{max-width:1180px}
.top{padding:12px 20px;margin-bottom:52px;border:1px solid var(--edge);border-radius:24px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 18px 48px -30px var(--shadow),inset 0 1px 0 var(--hi)}
.brand{font-size:30px;letter-spacing:-.05em}.brand:after{content:'PDF';font:600 10px var(--font-mono);letter-spacing:.12em;padding:5px 8px;border-radius:8px;background:var(--tint);color:var(--muted)}
.hero{position:relative;padding:clamp(28px,5vw,62px);border-radius:34px;overflow:hidden;background:linear-gradient(125deg,rgba(255,255,255,.84),rgba(255,255,255,.34));border:1px solid rgba(255,255,255,.8);box-shadow:0 26px 70px -38px var(--shadow),inset 0 1px 0 white;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.hero:after{content:'PDF';position:absolute;right:4%;top:8%;font:800 clamp(90px,17vw,210px)/1 var(--font-display);letter-spacing:-.1em;color:rgba(75,141,255,.07);pointer-events:none}
.hero h1{max-width:13ch;font-size:clamp(42px,7vw,78px);letter-spacing:-.065em;line-height:.98;position:relative;z-index:1}
.hero p{font-size:19px;max-width:54ch;position:relative;z-index:1}
.hero .jobs-label{margin-top:30px}
.search-wrap{display:flex;align-items:center;gap:12px;max-width:650px;margin:30px 0 0;padding:7px 10px 7px 18px;border:1px solid var(--line);border-radius:18px;background:var(--glass-strong);box-shadow:inset 0 1px 3px var(--tint),0 12px 28px -22px var(--shadow);position:relative;z-index:2}
.search-wrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:500 16px var(--font-body);padding:10px 0}.search-wrap input::placeholder{color:var(--muted)}
.search-icon{font-size:20px;color:var(--muted)}.search-count{font:12px var(--font-mono);color:var(--muted);white-space:nowrap}
.trust-row{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:22px;color:var(--muted);font-size:13px;font-weight:600}.trust-row span{display:flex;align-items:center;gap:7px}.trust-row b{color:#19866b}
.group{margin-top:42px}.ghead{margin-bottom:18px}.ghead h2{font-size:27px;letter-spacing:-.035em}.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.tile{min-height:178px;padding:22px;border-radius:24px;background:linear-gradient(145deg,var(--glass-strong),var(--glass));box-shadow:0 16px 36px -24px var(--shadow),inset 0 1px 0 var(--hi);border-color:var(--edge)}
.tool-mark{font-size:27px;line-height:1;margin-bottom:5px;filter:drop-shadow(0 5px 9px rgba(50,90,160,.16))}.tile .tag{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.tile h3{font-size:21px;letter-spacing:-.025em}.tile p{font-size:14px}.tile:hover{transform:translateY(-5px);box-shadow:0 22px 44px -24px var(--shadow),inset 0 1px 0 var(--hi)}
.tile .tool-mark{display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin-bottom:7px;border-radius:14px;background:linear-gradient(135deg,rgba(75,141,255,.16),rgba(139,92,246,.15));font-size:21px}
.empty-search{padding:30px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);text-align:center;background:var(--glass)}

<script>
(function(){
'use strict';

/* ---------- small helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(n<10485760?2:1)+' MB';
const baseName=n=>n.replace(/\.[^.]+$/,'');
const tick=()=>new Promise(r=>setTimeout(r,0));
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
let uidN=0;const uid=()=>'f'+(++uidN);
const pdfBlob=bytes=>new Blob([bytes],{type:'application/pdf'});
const saving=(a,b)=>{const p=Math.round((1-b/a)*100);return p>=0?'−'+p+'%':'+'+(-p)+'%';};

function need(lib,label){
  if(!window[lib]) throw new Error('The '+label+' engine did not load. Check your internet connection and reload the page.');
}

/* ---------- page ranges: "1-3, 5, 8-" ---------- */
function parseRangeGroups(str,max){
  const parts=String(str||'').replace(/\s*-\s*/g,'-').split(/[\s,;]+/).filter(Boolean);
  if(!parts.length) throw new Error('Enter page numbers, for example 1-3, 5, 8-');
  return parts.map(p=>{
    let a,b,m=p.match(/^(\d*)-(\d*)$/);
    if(m&&(m[1]||m[2])){a=m[1]?+m[1]:1;b=m[2]?+m[2]:max;if(a>b){const t=a;a=b;b=t;}}
    else if(/^\d+$/.test(p)){a=b=+p;}
    else throw new Error('"'+p+'" is not a page number or range');
    if(a<1||b>max) throw new Error('Page '+(a<1?a:b)+' is outside this file, which has '+plural(max,'page'));
    const r=[];for(let i=a;i<=b;i++)r.push(i-1);return r;
  });
}
const parseRanges=(s,m)=>parseRangeGroups(s,m).flat();

/* ---------- PDF and image engines ---------- */
async function loadLib(file){
  need('PDFLib','PDF');
  return PDFLib.PDFDocument.load(await file.arrayBuffer(),{updateMetadata:false});
}
async function openPdf(file){
  need('pdfjsLib','PDF viewer');
  const data=new Uint8Array(await file.arrayBuffer());
  return pdfjsLib.getDocument({data,isEvalSupported:false}).promise;
}
async function renderToCanvas(pdf,pageNo,scale){
  const page=await pdf.getPage(pageNo);
  const v1=page.getViewport({scale:1});
  scale=Math.min(scale,Math.sqrt(16e6/(v1.width*v1.height)));
  const vp=page.getViewport({scale});
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.ceil(vp.width));canvas.height=Math.max(1,Math.ceil(vp.height));
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  page.cleanup();
  return canvas;
}
const toBlob=(c,type,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Could not create the image')),type,q));
async function pdfThumb(pdf){
  const page=await pdf.getPage(1);const w=page.getViewport({scale:1}).width;
  const c=await renderToCanvas(pdf,1,110/w);
  return c.toDataURL('image/jpeg',0.7);
}
async function decodeImage(file){
  if(window.createImageBitmap){
    try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}
  }
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error('Your browser cannot read '+file.name+'. HEIC photos from iPhones need to be converted to JPG first.'));
    im.src=u;
  });
}
const dim=img=>({w:img.naturalWidth||img.width,h:img.naturalHeight||img.height});
function drawScaled(img,w,h,flatten){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  if(flatten){x.fillStyle='#fff';x.fillRect(0,0,w,h);}
  x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
  return c;
}
async function encodeToTarget(img,W,H,mime,q,target){
  let w=W,h=H,res=null;
  for(let round=0;round<14;round++){
    const c=drawScaled(img,w,h,mime!=='image/png');
    if(mime==='image/png'){
      const b=await toBlob(c,mime);res={blob:b,w,h};
      if(!target||b.size<=target)return res;
    }else{
      const hi0=target?0.95:q;
      const b0=await toBlob(c,mime,hi0);res={blob:b0,w,h};
      if(!target||b0.size<=target)return res;
      let lo=0.05,hi=hi0,best=null;
      for(let i=0;i<7;i++){
        const mid=(lo+hi)/2,b=await toBlob(c,mime,mid);
        if(b.size<=target){best=b;lo=mid;}else hi=mid;
      }
      if(best)return {blob:best,w,h};
    }
    c.width=c.height=0;
    const nw=Math.round(w*0.85),nh=Math.round(h*0.85);
    if(nw<32||nh<32)break;
    w=nw;h=nh;
  }
  return res;
}

/* ---------- PDF text to Word ---------- */
async function pdfToLines(pdf,onPage){
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),tc=await page.getTextContent(),its=[];
    for(const i of tc.items){
      if(!i.str||!i.str.trim())continue;
      const t=i.transform;
      its.push({s:i.str,x:t[4],y:t[5],h:Math.hypot(t[2],t[3])||i.height||10,w:i.width||0});
    }
    its.sort((a,b)=>b.y-a.y);
    const lines=[];
    for(const it of its){
      const L=lines[lines.length-1];
      if(L&&Math.abs(L.y-it.y)<=Math.max(1.5,Math.min(L.h,it.h)*0.45)){L.items.push(it);L.h=Math.max(L.h,it.h);}
      else lines.push({y:it.y,h:it.h,items:[it]});
    }
    for(const L of lines){
      L.items.sort((a,b)=>a.x-b.x);
      let text='',prev=null;
      for(const it of L.items){
        if(prev){
          const gap=it.x-(prev.x+prev.w);
          if(gap>L.h*2.5)text+='\t';
          else if(gap>L.h*0.12&&!/\s$/.test(text)&&!/^\s/.test(it.s))text+=' ';
        }
        text+=it.s;prev=it;
      }
      L.text=text.replace(/\s+$/,'');
      L.x0=L.items[0].x;
      const last=L.items[L.items.length-1];L.x1=last.x+last.w;
    }
    pages.push(lines);page.cleanup();
    await onPage(p);
  }
  return pages;
}
function buildParas(pages,mode){
  const hs=[];pages.forEach(ls=>ls.forEach(l=>hs.push(l.h)));hs.sort((a,b)=>a-b);
  const body=hs.length?hs[Math.floor(hs.length/2)]:11;
  const paras=[];let pendingBreak=false;
  pages.forEach((lines,pi)=>{
    if(pi>0)pendingBreak=true;
    if(!lines.length)return;
    const minX=Math.min(...lines.map(l=>l.x0)),maxX=Math.max(...lines.map(l=>l.x1)),span=Math.max(1,maxX-minX);
    let cur=null,prev=null;
    for(const l of lines){
      const head=l.h>body*1.25;
      const bullet=/^(•|●|▪|[-*]|\d{1,3}[.)]|[A-Za-z][.)])\s/.test(l.text);
      const bigGap=prev?(prev.y-l.y)>prev.h*1.7:false;
      const newP=!cur||mode==='lines'||head||cur.head||bullet||bigGap||(prev.x1-minX)<span*0.68;
      if(newP){
        if(bigGap&&paras.length)paras[paras.length-1].after=200;
        cur={text:l.text,h:l.h,head,after:mode==='lines'?0:120,pageBreak:pendingBreak};
        pendingBreak=false;paras.push(cur);
      }else cur.text+=' '+l.text.trim();
      prev=l;
    }
  });
  return {paras,body};
}
const xmlEsc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function makeDocx(paras,body){
  need('JSZip','ZIP');
  const bodySz=Math.round(Math.min(Math.max(body,9),13)*2);
  const F='<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/>';
  const xml=paras.map(p=>{
    const sz=p.head?Math.min(56,Math.max(bodySz+4,Math.round(bodySz*p.h/body))):bodySz;
    const runs=p.text.split('\t').map((t,i)=>(i?'<w:r><w:tab/></w:r>':'')+(t?'<w:r><w:rPr>'+F+(p.head?'<w:b/>':'')+'<w:sz w:val="'+sz+'"/></w:rPr><w:t xml:space="preserve">'+xmlEsc(t)+'</w:t></w:r>':'')).join('');
    return '<w:p><w:pPr>'+(p.pageBreak?'<w:pageBreakBefore/>':'')+'<w:spacing w:after="'+p.after+'" w:line="276" w:lineRule="auto"/></w:pPr>'+runs+'</w:p>';
  }).join('');
  const zip=new JSZip();
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+xml+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
}

/* ---------- tools ---------- */
async function eachFile(ctx,fn){
  const outs=[],n=ctx.files.length;
  for(let i=0;i<n;i++){
    const f=ctx.files[i];
    const sub=(fr,msg)=>ctx.progress((i+fr)/n,(n>1?'File '+(i+1)+' of '+n+' · ':'')+(msg||f.name));
    const r=await fn(f,sub);
    outs.push(...[].concat(r));
  }
  return outs;
}
const PAGES_OPT=(show)=>({key:'pages',label:'Pages',type:'text',def:'1',placeholder:'1-3, 5, 8-',hint:'Use commas and ranges. "8-" means page 8 to the end.',show});
const PDF_ACCEPT='.pdf,application/pdf',IMG_ACCEPT='image/*';

const TOOLS=[
{id:'merge',group:'organize',kind:'pdf',multiple:true,min:2,order:true,name:'Merge PDF',tag:'A + B → PDF',
 desc:'Combine several PDFs into one file, in the order you choose.',action:'Merge PDFs',options:[],
 hint:'Files are joined in the order listed. Use the arrow buttons to change it.',
 async run(ctx){
  const out=await PDFLib.PDFDocument.create(),n=ctx.files.length;
  for(let i=0;i<n;i++){
    await ctx.progress(i/n,'Adding '+ctx.files[i].name);
    const src=await loadLib(ctx.files[i].file);
    (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
  }
  const blob=pdfBlob(await out.save());
  return [{name:'merged.pdf',blob,note:plural(out.getPageCount(),'page')}];
 }},
{id:'split',group:'organize',kind:'pdf',multiple:false,min:1,name:'Split PDF',tag:'PDF → PDFs',
 desc:'Pull out pages, or cut one PDF into several smaller files.',action:'Split PDF',
 reactive:true,
 options:[
  {key:'mode',label:'What to do',type:'select',def:'one',wide:true,choices:[['one','Keep chosen pages in one new PDF'],['groups','Make a separate PDF for each range'],['each','Make a separate PDF for every page']]},
  PAGES_OPT(o=>o.mode!=='each')
 ],
 async run(ctx){
  const f=ctx.files[0],o=ctx.opts,src=await loadLib(f.file),n=src.getPageCount(),base=baseName(f.name),pad=String(n).length;
  const build=async idxs=>{const d=await PDFLib.PDFDocument.create();(await d.copyPages(src,idxs)).forEach(p=>d.addPage(p));return pdfBlob(await d.save());};
  if(o.mode==='each'){
    const outs=[];
    for(let i=0;i<n;i++){await ctx.progress(i/n,'Page '+(i+1)+' of '+n);outs.push({name:base+'-page-'+String(i+1).padStart(pad,'0')+'.pdf',blob:await build([i])});}
    return outs;
  }
  if(o.mode==='groups'){
    const gs=parseRangeGroups(o.pages,n),outs=[];
    for(let i=0;i<gs.length;i++){await ctx.progress(i/gs.length,'Part '+(i+1)+' of '+gs.length);outs.push({name:base+'-part-'+(i+1)+'.pdf',blob:await build(gs[i]),note:plural(gs[i].length,'page')});}
    return outs;
  }
  const idx=parseRanges(o.pages,n);await ctx.progress(0.5,'Building PDF');
  return [{name:base+'-extract.pdf',blob:await build(idx),note:plural(idx.length,'page')}];
 }},
{id:'remove-pages',group:'organize',kind:'pdf',multiple:false,min:1,name:'Remove pages',tag:'PDF − pages',
 desc:'Delete pages you do not need and keep the rest.',action:'Remove pages',
 options:[Object.assign(PAGES_OPT(),{label:'Pages to remove',wide:true})],
 async run(ctx){
  const f=ctx.files[0],src=await loadLib(f.file),n=src.getPageCount(),gone=new Set(parseRanges(ctx.opts.pages,n));
  const keep=src.getPageIndices().filter(i=>!gone.has(i));
  if(!keep.length)throw new Error('That would remove every page. Keep at least one.');
  await ctx.progress(0.4,'Building PDF');
  const d=await PDFLib.PDFDocument.create();(await d.copyPages(src,keep)).forEach(p=>d.addPage(p));
  return [{name:baseName(f.name)+'-trimmed.pdf',blob:pdfBlob(await d.save()),note:plural(gone.size,'page')+' removed, '+plural(keep.length,'page')+' left'}];
 }},
{id:'rotate',group:'organize',kind:'pdf',multiple:true,min:1,name:'Rotate PDF',tag:'PDF · 90°',
 desc:'Turn sideways pages upright, for all pages or only some.',action:'Rotate PDF',reactive:true,
 options:[
  {key:'angle',label:'Rotate',type:'select',def:'90',choices:[['90','90° clockwise'],['180','180°'],['270','90° anticlockwise']]},
  {key:'apply',label:'Apply to',type:'select',def:'all',choices:[['all','All pages'],['some','Chosen pages only']]},
  Object.assign(PAGES_OPT(o=>o.apply==='some'),{wide:true})
 ],
 async run(ctx){
  const a=+ctx.opts.angle;
  return eachFile(ctx,async(f,sub)=>{
    await sub(0.2,'Rotating '+f.name);
    const d=await loadLib(f.file),pages=d.getPages();
    const idx=ctx.opts.apply==='all'?pages.map((_,i)=>i):parseRanges(ctx.opts.pages,pages.length);
    idx.forEach(i=>pages[i].setRotation(PDFLib.degrees((pages[i].getRotation().angle+a)%360)));
    return {name:baseName(f.name)+'-rotated.pdf',blob:pdfBlob(await d.save()),note:plural(idx.length,'page')+' rotated'};
  });
 }},
{id:'jpg-to-pdf',group:'convert',kind:'image',multiple:true,min:1,order:true,name:'JPG to PDF',tag:'JPG → PDF',
 desc:'Turn photos and scans into one PDF. Works with JPG, PNG and WebP.',action:'Create PDF',
 options:[
  {key:'size',label:'Page size',type:'select',def:'a4',choices:[['a4','A4'],['letter','US Letter'],['fit','Same as the image']]},
  {key:'orient',label:'Orientation',type:'select',def:'auto',choices:[['auto','Automatic'],['portrait','Portrait'],['landscape','Landscape']]},
  {key:'margin',label:'Margin',type:'select',def:'24',choices:[['0','None'],['24','Small'],['48','Medium']]}
 ],
 hint:'One image per page, in the order listed.',
 async run(ctx){
  const doc=await PDFLib.PDFDocument.create(),m=+ctx.opts.margin,n=ctx.files.length;
  for(let i=0;i<n;i++){
    const f=ctx.files[i];await ctx.progress(i/n,'Adding '+f.name);
    const img=await decodeImage(f.file),{w,h}=dim(img);let emb=null;
    if(f.file.type==='image/png'){try{emb=await doc.embedPng(await f.file.arrayBuffer());}catch(e){emb=null;}}

    if(img.close)img.close();
    let pw,ph;
    if(ctx.opts.size==='fit'){pw=w*0.75+2*m;ph=h*0.75+2*m;}
    else{
      [pw,ph]=ctx.opts.size==='letter'?[612,792]:[595.28,841.89];
      const land=ctx.opts.orient==='landscape'||(ctx.opts.orient==='auto'&&w>h);
      if(land)[pw,ph]=[ph,pw];
    }
    const s=Math.min((pw-2*m)/w,(ph-2*m)/h),dw=w*s,dh=h*s;
    doc.addPage([pw,ph]).drawImage(emb,{x:(pw-dw)/2,y:(ph-dh)/2,width:dw,height:dh});

  }
  return [{name:'images.pdf',blob:pdfBlob(await doc.save()),note:plural(n,'page')}];
 }},
{id:'pdf-to-jpg',group:'convert',kind:'pdf',multiple:false,min:1,name:'PDF to JPG',tag:'PDF → JPG',
 desc:'Save every page of a PDF as a picture.',action:'Convert to images',
 options:[
  {key:'dpi',label:'Quality',type:'select',def:'150',choices:[['72','Small (72 dpi)'],['150','Standard (150 dpi)'],['200','High (200 dpi)'],['300','Print (300 dpi)']]},
  {key:'format',label:'Format',type:'select',def:'jpeg',choices:[['jpeg','JPG'],['png','PNG']]},
  {key:'pages',label:'Pages',type:'text',def:'',wide:true,placeholder:'All pages. Or type 1-3, 5',hint:'Leave empty to convert every page.'}
 ],
 async run(ctx){
  const f=ctx.files[0],pdf=f.pdf,n=pdf.numPages,base=baseName(f.name),o=ctx.opts;
  const list=o.pages.trim()?parseRanges(o.pages,n).map(i=>i+1):Array.from({length:n},(_,i)=>i+1);
  const mime=o.format==='png'?'image/png':'image/jpeg',ext=o.format==='png'?'png':'jpg',pad=String(n).length,outs=[];
  for(let i=0;i<list.length;i++){
    await ctx.progress(i/list.length,'Page '+list[i]+' ('+(i+1)+' of '+list.length+')');
    const c=await renderToCanvas(pdf,list[i],(+o.dpi)/72),b=await toBlob(c,mime,0.9);
    outs.push({name:base+'-page-'+String(list[i]).padStart(pad,'0')+'.'+ext,blob:b,note:c.width+'×'+c.height+' px'});
    c.width=c.height=0;
  }
  return outs;
 }},
{id:'pdf-to-word',group:'convert',kind:'pdf',multiple:true,min:1,name:'PDF to Word',tag:'PDF → DOCX',
 desc:'Get the text of a PDF into an editable Word file.',action:'Convert to Word',

{id:'compress-pdf',group:'optimize',kind:'pdf',multiple:true,min:1,name:'Compress PDF',tag:'PDF ↓ MB',

 options:[{key:'level',label:'Compression',type:'select',def:'balanced',wide:true,choices:[['light','Light, sharper pages'],['balanced','Balanced'],['strong','Strong, smallest file']]}],

{id:'compress-image',group:'optimize',kind:'image',multiple:true,min:1,name:'Compress and resize photo',tag:'JPG ↓ KB',

 options:[
  {key:'target',label:'Target size in KB (optional)',type:'number',def:0,min:0,max:5000,step:1,wide:true,hint:'Type 50 for a 50 KB form photo. Kagaz lowers quality, then size, until it fits. Leave 0 to skip.'},
  {key:'size',label:'Longest side',type:'select',def:'0',choices:[['0','Keep original'],['1920','1920 px'],['1280','1280 px'],['1024','1024 px'],['800','800 px'],['600','600 px']]},
  {key:'format',label:'Save as',type:'select',def:'jpeg',choices:[['jpeg','JPG'],['webp','WebP'],['png','PNG, no quality loss']]},
  {key:'quality',label:'Quality',type:'range',def:75,min:10,max:100,step:5,wide:true,show:o=>!(+o.target>0)&&o.format!=='png'}
 ],
 async run(ctx){
  const o=ctx.opts,target=+o.target>0?Math.round(+o.target*1024):0,EXT={'image/jpeg':'jpg','image/webp':'webp','image/png':'png'};
  return eachFile(ctx,async(f,sub)=>{
    await sub(0.1,'Reading '+f.name);
    const img=await decodeImage(f.file);let {w,h}=dim(img);
    const side=+o.size;
    if(side&&Math.max(w,h)>side){const s=side/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
    let mime={jpeg:'image/jpeg',webp:'image/webp',png:'image/png'}[o.format];
    if(target&&mime==='image/png')mime='image/jpeg';
    await sub(0.4,'Compressing '+f.name);
    const r=await encodeToTarget(img,w,h,mime,(+o.quality)/100,target);
    if(img.close)img.close();
    const ext=EXT[r.blob.type]||'jpg';
    let note=fmtSize(f.size)+' → '+fmtSize(r.blob.size)+' ('+saving(f.size,r.blob.size)+') · '+r.w+'×'+r.h+' px';
    if(target&&r.blob.size>target)note+=' · could not get under '+o.target+' KB';

function releaseEntry(e){
  try{if(e.pdf)e.pdf.destroy();}catch(x){}
  if(e.objUrl&&e.thumb)URL.revokeObjectURL(e.thumb);
}
function resetTool(){state.files.forEach(releaseEntry);state.files=[];state.results=null;state.error=null;state.busy=false;}

let toastTimer=0;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3200);
}

/* ---------- saving ---------- */
async function saveFile(name,blob){
  const hosted=window.claude&&typeof window.claude.use==='function';
  let dl=null;
  if(hosted){try{dl=await window.claude.use('downloads');}catch(e){dl=null;}}
  if(dl){
    try{await dl.save({filename:name,data:blob});toast('Saved '+name);}
    catch(e){if(e&&e.code==='declined')return;toast('Could not save '+name+'. Please try again.');}
    return;
  }
  if(hosted){toast('Downloads are not available in this view. Open the page in a browser tab.');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function saveZip(outs){
  need('JSZip','ZIP');
  const zip=new JSZip(),seen=new Set();
  outs.forEach(o=>{
    let n=o.name,k=2;
    while(seen.has(n)){n=o.name.replace(/(\.[^.]*)$/,'-'+(k++)+'$1');}
    seen.add(n);zip.file(n,o.blob);
  });
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
  await saveFile('kagaz-files.zip',blob);
}

function showTool(t){
  resetTool();state.tool=t;
  state.opts={};t.options.forEach(o=>{state.opts[o.key]=o.def;});
  if(state.preset&&state.preset.tool===t.id){Object.assign(state.opts,state.preset.opts||{});}
  state.preset=null;
  app.innerHTML=toolHTML(t);
  renderOpts();renderRun();window.scrollTo(0,0);
}
let routed=false;
function route(){
  const id=location.hash.replace(/^#/,''),t=TOOLS.find(x=>x.id===id);
  if(t)showTool(t);else showHome();
  if(routed)focusHeading();
  routed=true;
}

function fieldHTML(o){
  const id='o-'+o.key,v=state.opts[o.key],w=o.wide?' wide':'';
  const hint=o.hint?'<div class="hint" id="'+id+'-hint">'+esc(o.hint)+'</div>':'';
  const dby=o.hint?' aria-describedby="'+id+'-hint"':'';
  if(o.type==='checkbox')
    return '<div class="field'+w+'"><label class="check"><input type="checkbox" id="'+id+'" data-key="'+o.key+'"'+(v?' checked':'')+'>'+esc(o.label)+'</label></div>';
  let ctl='';
  if(o.type==='select')ctl='<select id="'+id+'" data-key="'+o.key+'"'+dby+'>'+o.choices.map(c=>'<option value="'+esc(c[0])+'"'+(String(c[0])===String(v)?' selected':'')+'>'+esc(c[1])+'</option>').join('')+'</select>';
  else if(o.type==='number')ctl='<input type="number" id="'+id+'" data-key="'+o.key+'" inputmode="numeric" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" value="'+esc(v)+'"'+dby+'>';
  else if(o.type==='range')ctl='<div class="rangerow"><input type="range" id="'+id+'" data-key="'+o.key+'" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" value="'+esc(v)+'"'+dby+'><output id="'+id+'-out" for="'+id+'">'+esc(v)+'%</output></div>';
  else ctl='<input type="text" id="'+id+'" data-key="'+o.key+'" value="'+esc(v)+'" placeholder="'+esc(o.placeholder||'')+'" autocomplete="off"'+dby+'>';
  return '<div class="field'+w+'"><label for="'+id+'">'+esc(o.label)+'</label>'+ctl+hint+'</div>';
}
function renderOpts(){
  const t=state.tool,box=$('#opts');if(!box)return;
  const activeId=document.activeElement&&document.activeElement.id;
  const shown=t.options.filter(o=>!o.show||o.show(state.opts));
  box.innerHTML=(t.hint?'<p class="hint-line">'+esc(t.hint)+'</p>':'')+shown.map(fieldHTML).join('');
  if(activeId){const el=document.getElementById(activeId);if(el&&box.contains(el))el.focus();}
}
function renderRun(){
  const t=state.tool,btn=$('#run');if(!btn)return;
  const n=validFiles().length,loading=state.files.some(f=>f.loading);
  btn.textContent=state.busy?'Working…':t.action;
  btn.disabled=state.busy||loading||n<t.min;btn.setAttribute('aria-busy',state.busy?'true':'false');
  $('#need').textContent=state.busy?'':loading?'Reading your files…':n<t.min?(t.min>1?'Add at least '+t.min+' files to continue':'Add '+(t.kind==='pdf'?'a PDF':'a photo')+' to continue'):'';
}
function renderFiles(){
  const ul=$('#files');if(!ul)return;
  const t=state.tool;ul.hidden=!state.files.length;
  ul.innerHTML=state.files.map((f,i)=>{
    const thumb=f.thumb?'<img src="'+esc(f.thumb)+'" alt="">':(f.loading?'…':t.kind==='pdf'?'PDF':'IMG');
    const meta=f.error?'<div class="fmeta bad">'+esc(f.error)+'</div>':
      '<div class="fmeta">'+fmtSize(f.size)+(f.loading?' · reading…':f.pages?' · '+plural(f.pages,'page'):f.dims?' · '+f.dims+' px':'')+'</div>';
    const mv=t.order&&state.files.length>1?
      '<button type="button" class="ibtn" data-act="up" data-id="'+f.id+'" aria-label="Move '+esc(f.name)+' up"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button type="button" class="ibtn" data-act="down" data-id="'+f.id+'" aria-label="Move '+esc(f.name)+' down"'+(i===state.files.length-1?' disabled':'')+'>↓</button>':'';
    return '<li class="file"><div class="thumb">'+thumb+'</div><div class="finfo"><div class="fname">'+esc(f.name)+'</div>'+meta+'</div>'+
      '<div class="fact">'+mv+'<button type="button" class="ibtn" data-act="remove" data-id="'+f.id+'" aria-label="Remove '+esc(f.name)+'">✕</button></div></li>';
  }).join('');
}
function renderResult(){
  const box=$('#result');if(!box)return;
  const r=state.results;
  if(!r){box.innerHTML='';return;}
  box.innerHTML='<section class="done" aria-labelledby="done-h"><span class="cm tl"></span><span class="cm tr"></span><span class="cm bl"></span><span class="cm br"></span>'+
    '<h2 id="done-h" tabindex="-1">Done</h2><p class="sub">'+plural(r.length,'file')+' ready · '+fmtSize(r.reduce((s,o)=>s+o.blob.size,0))+' in total</p>'+
    '<ul class="outs">'+r.map((o,i)=>'<li class="out"><div class="oinfo"><div class="oname">'+esc(o.name)+'</div><div class="ometa">'+fmtSize(o.blob.size)+(o.note?' · '+esc(o.note):'')+'</div></div>'+
      '<button type="button" class="btn secondary" data-act="save" data-i="'+i+'" aria-label="Save '+esc(o.name)+'">Save</button></li>').join('')+'</ul>'+
    '<div class="done-actions">'+(r.length>1?'<button type="button" class="btn primary" data-act="saveall">Save all as ZIP</button>':'')+
    '<button type="button" class="link" data-act="again">Start over</button></div></section>';
  const h=$('#done-h');if(h)h.focus();
}
function showErr(msg){const e=$('#err');if(e)e.innerHTML=msg?'<div class="err">'+esc(msg)+'</div>':'';}
async function setProgress(frac,msg){
  const p=$('#prog');if(!p)return;
  const pct=Math.max(2,Math.min(100,frac*100));
  p.hidden=false;$('#bar').style.width=pct+'%';$('#barwrap').setAttribute('aria-valuenow',Math.round(pct));$('#pmsg').textContent=msg||'';
  await tick();
}
function announce(msg){
  const s=$('#sr');if(!s)return;
  s.textContent='';setTimeout(()=>{s.textContent=msg;},60);
}
function focusHeading(){const h=$('#page-h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}

/* ---------- actions ---------- */
async function initEntry(e,t){
  try{
    if(t.kind==='pdf'){
      e.pdf=await openPdf(e.file);e.pages=e.pdf.numPages;
      try{e.thumb=await pdfThumb(e.pdf);}catch(x){}
    }else{
      const img=await decodeImage(e.file),d=dim(img);e.dims=d.w+'×'+d.h;
      e.thumb=URL.createObjectURL(e.file);e.objUrl=true;if(img.close)img.close();
    }
  }catch(err){
    e.error=err&&err.name==='PasswordException'?'Password-protected. Remove the password first.':
      t.kind==='pdf'?'This file could not be read as a PDF.':(err&&err.message)||'This image could not be read.';
  }
  e.loading=false;
}
async function addFiles(list){
  const t=state.tool;if(!t)return;
  let incoming=[...list];if(!incoming.length)return;
  const skipped=[];
  incoming=incoming.filter(f=>{
    const good=t.kind==='pdf'?(/\.pdf$/i.test(f.name)||f.type==='application/pdf'):f.type.indexOf('image/')===0;
    if(!good)skipped.push(f.name);return good;
  });
  showErr(skipped.length?'Skipped '+plural(skipped.length,'file')+'. This tool needs '+(t.kind==='pdf'?'PDF files':'image files')+'.':'');
  if(!incoming.length)return;
  if(!t.multiple){state.files.forEach(releaseEntry);state.files=[];incoming=incoming.slice(0,1);}
  state.results=null;renderResult();
  const entries=incoming.map(file=>({id:uid(),file,name:file.name,size:file.size,loading:true}));
  state.files.push(...entries);renderFiles();renderRun();
  for(const e of entries){
    await initEntry(e,t);
    if(state.tool!==t||!state.files.includes(e)){releaseEntry(e);continue;}
    renderFiles();renderRun();
    announce(e.error?e.name+': '+e.error:e.name+' added');
  }
}
async function samplePdf(label){
  need('PDFLib','PDF');
  const d=await PDFLib.PDFDocument.create(),b=await d.embedFont(PDFLib.StandardFonts.HelveticaBold),r=await d.embedFont(PDFLib.StandardFonts.Helvetica);
  const titles=['Cover','Chapter 1','Chapter 2','Notes'];
  const body=['Kagaz works on your own device. This sample PDF was made','in your browser a moment ago, so you can try the tool','without hunting for a file.','','Every page has a different title and number, which makes','it easy to see what merging, splitting, rotating or','numbering actually did to the file.'];
  titles.forEach((t,i)=>{
    const p=d.addPage([595.28,841.89]);
    p.drawText(t,{x:56,y:760,size:34,font:b,color:PDFLib.rgb(.06,.1,.18)});
    p.drawText('Sample '+label+' · page '+(i+1)+' of '+titles.length,{x:56,y:730,size:12,font:r,color:PDFLib.rgb(.4,.45,.52)});
    body.forEach((ln,k)=>p.drawText(ln,{x:56,y:680-k*20,size:13,font:r,color:PDFLib.rgb(.1,.13,.2)}));
  });
  return new File([await d.save()],'sample-'+label+'.pdf',{type:'application/pdf'});
}
async function sampleImage(){
  const c=document.createElement('canvas');c.width=1600;c.height=1200;
  const x=c.getContext('2d'),g=x.createLinearGradient(0,0,1600,1200);
  g.addColorStop(0,'#0097BA');g.addColorStop(.55,'#D4136F');g.addColorStop(1,'#E5A800');
  x.fillStyle=g;x.fillRect(0,0,1600,1200);
  x.fillStyle='rgba(255,255,255,.18)';
  for(let i=0;i<40;i++){x.beginPath();x.arc((i*397)%1600,(i*251)%1200,40+(i*13)%90,0,7);x.fill();}
  x.fillStyle='#fff';x.font='700 120px sans-serif';x.fillText('Sample photo',90,1080);
  return new File([await toBlob(c,'image/jpeg',0.95)],'sample-photo.jpg',{type:'image/jpeg'});
}
async function addSamples(){
  const t=state.tool;
  try{
    const files=[];
    if(t.kind==='pdf'){const n=Math.max(1,t.min);for(let i=0;i<n;i++)files.push(await samplePdf(n>1?String.fromCharCode(97+i):'file'));}
    else files.push(await sampleImage());
    await addFiles(files);
  }catch(e){showErr(e.message);}
}
function friendly(e){
  const m=(e&&e.message)||'Something went wrong.';
  return /Failed to parse|Invalid|Expected instance/i.test(m)?'One of the files could not be processed. It may be damaged. ('+m+')':m;
}
async function run(){
  const t=state.tool,files=validFiles();
  if(state.busy||files.length<t.min)return;
  state.busy=true;state.results=null;showErr('');renderResult();renderRun();
  announce('Working. This can take a moment for large files.');
  await setProgress(0,'Starting');
  try{
    const outs=await t.run({opts:Object.assign({},state.opts),files,progress:setProgress});
    if(state.tool!==t)return;
    state.results=outs;
  }catch(e){
    if(state.tool===t)showErr(friendly(e));
  }finally{
    if(state.tool===t){state.busy=false;const p=$('#prog');if(p)p.hidden=true;renderRun();renderResult();}
  }
}

app.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.closest('#drop'))$('#fileInput').click();return;}
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='pick'){$('#fileInput').click();}
  else if(act==='sample'){ev.stopPropagation();addSamples();}
  else if(act==='run'){run();}
  else if(act==='remove'){const i=state.files.findIndex(f=>f.id===id);if(i>=0){releaseEntry(state.files[i]);state.files.splice(i,1);}state.results=null;renderFiles();renderRun();renderResult();}
  else if(act==='up'||act==='down'){
    const i=state.files.findIndex(f=>f.id===id),j=act==='up'?i-1:i+1;
    if(i>=0&&j>=0&&j<state.files.length){const t=state.files[i];state.files[i]=state.files[j];state.files[j]=t;state.results=null;renderFiles();renderResult();}
  }
  else if(act==='save'){const o=state.results[+el.dataset.i];if(o)saveFile(o.name,o.blob);}
  else if(act==='saveall'){saveZip(state.results).catch(e=>toast(e.message));}
  else if(act==='again'){const t=state.tool;showTool(t);focusHeading();}
  else if(act==='preset'){const p=PRESETS[+el.dataset.i];state.preset={tool:p.tool,opts:p.opts};if(location.hash==='#'+p.tool)route();else location.hash=p.tool;}
});
app.addEventListener('input',ev=>{
  if(ev.target.id!=='toolSearch')return;
  const q=ev.target.value.trim().toLowerCase();let shown=0;
  app.querySelectorAll('.tile').forEach(tile=>{const ok=tile.textContent.toLowerCase().includes(q);tile.hidden=!ok;if(ok)shown++;});
  app.querySelectorAll('[data-group]').forEach(group=>{const count=group.querySelectorAll('.tile:not([hidden])').length;group.hidden=count===0;const c=group.querySelector('.count');if(c)c.textContent=count+' tools';});
  const empty=$('#emptySearch');if(empty)empty.hidden=shown!==0;
  const count=$('#searchCount');if(count)count.textContent=shown+' found';
});
app.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='fileInput'){addFiles(el.files).then(()=>{el.value='';});return;}
  const key=el.dataset&&el.dataset.key;if(!key)return;
  state.opts[key]=el.type==='checkbox'?el.checked:el.value;
  if(state.tool.reactive)renderOpts();
});
app.addEventListener('input',ev=>{
  const el=ev.target,key=el.dataset&&el.dataset.key;if(!key)return;
  state.opts[key]=el.type==='checkbox'?el.checked:el.value;
  if(el.type==='range'){const out=document.getElementById(el.id+'-out');if(out)out.textContent=el.value+'%';}
  if(state.tool.reactive&&el.type==='number')renderOpts();
});
app.addEventListener('dragover',ev=>{const d=ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.add('over');}});
app.addEventListener('dragleave',ev=>{const d=ev.target.closest('#drop');if(d)d.classList.remove('over');});
app.addEventListener('drop',ev=>{const d=ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.remove('over');addFiles(ev.dataTransfer.files);}});
window.addEventListener('dragover',ev=>ev.preventDefault());
window.addEventListener('drop',ev=>ev.preventDefault());
let sheenRaf=0;
app.addEventListener('pointermove',ev=>{
  const el=ev.target.closest('.tile,.drop,.chip,.done');if(!el||sheenRaf)return;
  const x=ev.clientX,y=ev.clientY;
  sheenRaf=requestAnimationFrame(()=>{sheenRaf=0;const r=el.getBoundingClientRect();el.style.setProperty('--mx',(x-r.left)+'px');el.style.setProperty('--my',(y-r.top)+'px');});
});
const rootEl=document.documentElement,calmBtn=$('#calm');
function setCalm(on,save){
  if(on)rootEl.setAttribute('data-calm','true');else rootEl.removeAttribute('data-calm');
  calmBtn.setAttribute('aria-pressed',on?'true':'false');
  if(save){try{localStorage.setItem('kagaz-calm',on?'1':'0');}catch(e){}}
}
let savedCalm=null;try{savedCalm=localStorage.getItem('kagaz-calm');}catch(e){}
setCalm(savedCalm==='1',false);
calmBtn.addEventListener('click',()=>{const on=rootEl.getAttribute('data-calm')!=='true';setCalm(on,true);announce(on?'Calm mode on. Motion and glass effects are off.':'Calm mode off.');});
$('#skip').addEventListener('click',()=>{app.focus();});
window.addEventListener('hashchange',route);

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
route();
window.__kagaz={parseRanges,parseRangeGroups,buildParas,TOOLS};
})();
</script>
